<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boolean Garden — spike</title>
<style>
  :root {
    --paper: #1c2422; --ink: #e8e2d4; --muted: #8b9a92;
    --teal: #4fa79a; --coral: #e0705a; --gold: #d9b45b;
  }
  * { margin: 0; box-sizing: border-box; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: Charter, Georgia, serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 16px;
  }
  header { display: flex; align-items: baseline; gap: 14px; width: 820px; max-width: 96vw; }
  h1 { font-size: 20px; font-weight: 600; letter-spacing: 0.02em; }
  #puzzleName { color: var(--gold); font-size: 16px; font-style: italic; }
  #par { color: var(--muted); font-size: 13px; margin-left: auto; }
  #board { background: #232d2a; border-radius: 10px; margin-top: 10px; touch-action: none;
           box-shadow: 0 4px 24px rgba(0,0,0,.35); max-width: 96vw; height: auto; }
  #toolbar { display: flex; gap: 10px; margin-top: 12px; align-items: center; }
  button {
    font-family: inherit; font-size: 15px; padding: 8px 18px;
    background: #2c3835; color: var(--ink); border: 1px solid #3d4b47;
    border-radius: 8px; cursor: pointer;
  }
  button:not(:disabled):hover { background: #35443f; }
  button:disabled { opacity: 0.35; cursor: default; }
  button.primary { border-color: var(--gold); }
  #status { margin-top: 10px; font-size: 15px; color: var(--muted); min-height: 22px;
            font-style: italic; text-align: center; }
  #status.solved { color: var(--gold); }
  #gallery { display: flex; gap: 10px; margin-top: 14px; min-height: 64px; }
  #gallery svg { width: 60px; height: 60px; background: #232d2a; border-radius: 8px;
                 border: 1px solid #3d4b47; }
</style>
</head>
<body>
  <header>
    <h1>Boolean Garden</h1>
    <span id="puzzleName"></span>
    <span id="par"></span>
  </header>
  <svg id="board" width="820" height="520" viewBox="0 0 820 520"></svg>
  <div id="toolbar">
    <button id="opUnion" title="Combine two shapes into one">Union ∪</button>
    <button id="opSubtract" title="Cut the second shape out of the first">Subtract ⊖</button>
    <button id="opIntersect" title="Keep only the overlap">Intersect ∩</button>
    <span style="width:18px"></span>
    <button id="undo">Undo</button>
    <button id="next" class="primary" style="display:none">Next puzzle →</button>
  </div>
  <div id="status"></div>
  <div id="gallery" title="Your garden"></div>
  <script src="dist/main.js"></script>
</body>
</html>
