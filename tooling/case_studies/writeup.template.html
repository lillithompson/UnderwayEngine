<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: phone frames in step order, grouped by phase, each with its caption beneath; findings follow as a short list. 
   Filled by build-writeup.js from the flow's writeup.json; edit the spec, not the built page. */
:root {
  --bg: #f3f3f4; --card: #ffffff; --ink: #24252A; --ink-2: #434750; --ink-3: #777A84;
  --line: rgba(36,37,42,0.10); --accent: #39BBF8; --warn: #a96a12; --warn-soft: #fbf1df; --bad: #b3361f; --bad-soft: #fbe4df; --ok: #2f7a3e; --ok-soft: #e1f2e4;
  --p0-bg: #e2eefa; --p0-fg: #1F5F99; --p1-bg: #fdf0dc; --p1-fg: #9a5a08; --p2-bg: #e3f3e6; --p2-fg: #2d6b39; --p3-bg: #efe6f8; --p3-fg: #6a3d99;
  --display: "Newsreader", Georgia, serif; --body: "Karla", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #17181b; --card: #212226; --ink: #ECEDF0; --ink-2: #C3C5CC; --ink-3: #8D909A;
  --line: rgba(236,237,240,0.12); --accent: #5CC8FA; --warn: #e3b061; --warn-soft: #3a2f1c; --bad: #f08b78; --bad-soft: #3d221d; --ok: #7fcf8f; --ok-soft: #1e3524;
  --p0-bg: #1d3550; --p0-fg: #9cc7f0; --p1-bg: #42300f; --p1-fg: #f2c27a; --p2-bg: #1e3524; --p2-fg: #8fd49d; --p3-bg: #34254a; --p3-fg: #cfb0f0; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #17181b; --card: #212226; --ink: #ECEDF0; --ink-2: #C3C5CC; --ink-3: #8D909A;
  --line: rgba(236,237,240,0.12); --accent: #5CC8FA; --warn: #e3b061; --warn-soft: #3a2f1c; --bad: #f08b78; --bad-soft: #3d221d; --ok: #7fcf8f; --ok-soft: #1e3524;
  --p0-bg: #1d3550; --p0-fg: #9cc7f0; --p1-bg: #42300f; --p1-fg: #f2c27a; --p2-bg: #1e3524; --p2-fg: #8fd49d; --p3-bg: #34254a; --p3-fg: #cfb0f0; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 16px; padding-block: 40px 72px; }
h1 { font: 500 clamp(30px, 5.5vw, 44px)/1.08 var(--display); margin: 0 0 10px; text-wrap: balance; }
h2 { font: 500 24px/1.2 var(--display); margin: 0 0 12px; text-wrap: balance; }
.lede { color: var(--ink-2); max-width: 66ch; margin: 0; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.phases { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 18px 0 0; padding: 0; list-style: none; color: var(--ink-3); font-size: 13px; }
.phases b { color: var(--ink); font-weight: 700; }

.phase { margin-top: 34px; }
.phase-head { display: flex; align-items: baseline; gap: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.phase-head h2 { margin: 0; }
.phase-head span { color: var(--ink-3); font-size: 13px; font-variant-numeric: tabular-nums; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 28px 22px; }
@media (max-width: 480px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 14px; } }
.frame { display: flex; flex-direction: column; gap: 10px; min-width: 0; margin: 0; }
.phone { border-radius: 26px; overflow: hidden; border: 1px solid var(--line); background: var(--card); box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 10px 28px rgba(0,0,0,.08); aspect-ratio: 390 / 844; max-width: 100%; }
.phone img { display: block; width: 100%; height: 100%; object-fit: cover; }
.step { display: flex; gap: 8px; align-items: baseline; }
.step .n { font: 500 13px var(--mono); color: var(--accent); font-variant-numeric: tabular-nums; }
.step .t { font-weight: 700; font-size: 14.5px; line-height: 1.3; min-width: 0; }
.frame p { margin: 0; color: var(--ink-2); font-size: 13.5px; }
.who { font: 700 11px/1 var(--body); letter-spacing: .05em; text-transform: uppercase; padding: 4px 7px; border-radius: 6px; margin-left: auto; white-space: nowrap; }
.who.p0 { background: var(--p0-bg); color: var(--p0-fg); }
.who.p1 { background: var(--p1-bg); color: var(--p1-fg); }
.who.p2 { background: var(--p2-bg); color: var(--p2-fg); }
.who.p3 { background: var(--p3-bg); color: var(--p3-fg); }
.hint { color: var(--ink-3); font-size: 13px; margin: 28px 0 0; max-width: 80ch; }

section.block { margin-top: 40px; }
.findings { display: grid; gap: 14px; margin: 0; padding: 0; list-style: none; }
.findings li { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: baseline; }
.tag { font: 700 11px/1 var(--body); letter-spacing: .05em; text-transform: uppercase; padding: 4px 7px; border-radius: 6px; background: var(--line); color: var(--ink-2); white-space: nowrap; }
.tag.bug { background: var(--bad-soft); color: var(--bad); }
.tag.friction { background: var(--warn-soft); color: var(--warn); }
.tag.works, .tag.fixed { background: var(--ok-soft); color: var(--ok); }
.findings p { margin: 0; color: var(--ink-2); min-width: 0; }
.findings b { color: var(--ink); }
.setup { color: var(--ink-2); max-width: 66ch; }
.setup p { margin: 0 0 8px; }
</style>

<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <ul class="phases" id="phases"></ul>
  </header>

  <div id="strip"></div>
  <p class="hint" id="hint"></p>

  <section class="block" aria-labelledby="f-h">
    <h2 id="f-h">What the capture turned up</h2>
    <ul class="findings" id="findings"></ul>
  </section>

  <section class="block setup" aria-labelledby="s-h">
    <h2 id="s-h">How this was captured</h2>
    <div id="setup"></div>
  </section>
</div>

<script>
// Text fields are trusted inline HTML written alongside the capture (<b>, <span class="mono">).
const D = __DATA__;
const FRAMES = __FRAMES__;
const TAGS = { bug: "Bug", friction: "Friction", polish: "Polish", check: "Check", works: "Works", fixed: "Fixed" };
const people = Object.keys(D.people || {});
const range = (a, b) => (a === b ? `${a}` : `${a}–${b}`);
const $ = id => document.getElementById(id);

$("title").textContent = D.title;
$("lede").innerHTML = D.lede;
$("phases").innerHTML = D.phases.map(([name, a, b]) => `<li><b>${name}</b> · ${range(a, b)}</li>`).join("");
$("hint").innerHTML = `Full-size 3× PNGs are in <span class="mono">${D.framesDir}</span>.` + (D.hint ? " " + D.hint : "");
$("findings").innerHTML = D.findings.map(f =>
  `<li><span class="tag ${f.tag}">${TAGS[f.tag] || f.tag}</span><p><b>${f.title}</b> ${f.body || ""}</p></li>`).join("");
$("setup").innerHTML = D.setup.map(p => `<p>${p}</p>`).join("");

$("strip").innerHTML = D.phases.map(([name, from, to]) => {
  const frames = [];
  for (let i = from - 1; i < to; i++) {
    const [who, title, text] = D.steps[i];
    const p = people.indexOf(who);
    frames.push(`
    <figure class="frame">
      <div class="phone"><img src="${FRAMES[i]}" alt="Frame ${i + 1}: ${title.replace(/"/g, "&quot;")}"></div>
      <figcaption>
        <div class="step"><span class="n">${String(i + 1).padStart(2, "0")}</span><span class="t">${title}</span>${p >= 0 ? `<span class="who p${p % 4}">${D.people[who]}</span>` : ""}</div>
        <p>${text}</p>
      </figcaption>
    </figure>`);
  }
  return `<section class="phase"><div class="phase-head"><h2>${name}</h2><span>${range(from, to)}</span></div><div class="grid">${frames.join("")}</div></section>`;
}).join("");
</script>
